# ============================================================
# Halos-lift  —  Phase 2: Mid-training on nuScenes BEV
# ============================================================
# Adapts the pretrained lifting model to real sensor statistics.
# Goal: align synthetic geometry features with real depth noise,
# camera distortions, and occlusion patterns.
#
# Requires: nuscenes-devkit + nuScenes v1.0-trainval
# Install: pip install nuscenes-devkit
# Data:    https://www.nuscenes.org/nuscenes
# ============================================================

inherits: base.yaml

data:
  source: nuscenes
  stage: mid_train
  nuscenes:
    data_root: null             # REQUIRED: /path/to/nuscenes
    version: v1.0-trainval
    map_classes:
      - drivable_surface
      - ped_crossing
      - walkway
      - stop_line
      - carpark_area
      - divider
  train_split: train
  val_split: val
  img_size: [448, 800]          # full nuScenes resolution
  num_workers: 4

train:
  epochs: 20
  batch_size: 4
  lr: 2.0e-4
  warmup_epochs: 2
  lr_scheduler: cosine
  weight_decay: 1.0e-7
  grad_clip: 5.0
  grad_accum_steps: 2
  checkpoint_every_n_epochs: 4

model:
  n_cameras: 6
  backbone_freeze: false
  heads:
    bev_seg:
      enabled: true
      n_classes: 6
    occ_3d:
      enabled: false
    depth_supervision:
      enabled: false

logging:
  backend: tensorboard
  tensorboard: true
  log_every_n_steps: 50

eval:
  enabled: true
  every_n_epochs: 4
  metrics:
    - miou_bev
  visualise_pred: true
